## Logging level
logging:
  level:
    com:
      abanoj:
        scheman: DEBUG
## Database Configuration
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    show-sql: false
  cache:
    jcache:
      provider: com.github.benmanes.caffeine.jcache.spi.CaffeineCachingProvider
    cache-names:
      - loginRateLimit
    caffeine:
      spec: maximumSize=100000,expireAfterAccess=600s
## Exception
server:
  error:
    include-message: always
## Security
application:
  cors:
    allowed-origins: http://localhost:3000
  security:
    jwt:
      expiration: 900000
      refresh:
        expiration: 604800000
      secret-key: ${JWT_SECRET}
  admin:
    email: admin@abanoj.com
    password: ${ADMIN_PASSWORD:admin123}
## Swagger
springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
    path: /docs
    doc-expansion: list
## Actuator
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "health, info"
## Rate Limiting
bucket4j:
  enabled: true
  filters:
    - id: loginFilter
      cache-name: loginRateLimit
      url: /api/v1/auth/login
      http-response-body: '{"status":429,"error":"Too Many Requests","message":"Too many login attempts. Please try again later.","path":"/api/v1/auth/login"}'
      rate-limits:
        - cache-key: getRemoteAddr()
          execute-predicates:
            - "METHOD=POST"
          bandwidths:
            - capacity: 5
              time: 10
              unit: minutes
              refill-speed: interval