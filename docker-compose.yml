services:
  db:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  scheman:
    build: ./backend
    container_name: scheman
    ports:
      - "8080:8080"
      - "8081:8081"
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/scheman
      SPRING_PROFILES_ACTIVE: prod
    networks:
      - db_network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: scheman-frontend
    ports:
      - "80:80"
    networks:
      - db_network
    depends_on:
      - scheman
    restart: unless-stopped

networks:
  db_network:
    driver: bridge

volumes:
  postgres_data: