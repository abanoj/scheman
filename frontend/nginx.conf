server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/x-javascript text/xml application/xml image/svg+xml font/woff2;

    # ---- Security headers (applied to the served document) ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Enable HSTS only when TLS is terminated upstream (HTTPS):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- Reverse proxy: forward API calls to the backend ----
    # The backend host is resolved at request time (via Docker's internal DNS)
    # instead of at startup, so nginx boots even if the backend is not up yet.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend "http://scheman:8080";
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- Long-cache fingerprinted static assets ----
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---- SPA fallback: every unknown route returns index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
