## Logging level
logging:
  level:
    root: INFO
    org:
      springframework: WARN
      hibernate:
        SQL: off
## Database Configuration
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
    show-sql: false
  cache:
    jcache:
      provider: com.github.benmanes.caffeine.jcache.spi.CaffeineCachingProvider
    cache-names:
      - loginRateLimit
    caffeine:
      spec: maximumSize=100000,expireAfterAccess=600s
## Exception
server:
  error:
    include-message: never
    include-stacktrace: never
## Security
application:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    jwt:
      expiration: 900000
      refresh:
        expiration: 604800000
      secret-key: ${JWT_SECRET}
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
## Swagger
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
## Actuator
management:
  endpoint:
    health:
      show-details: never
    shutdown:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health, info, metrics
## Rate Limiting
bucket4j:
  enabled: true
  filters:
    - id: loginFilter
      cache-name: loginRateLimit
      url: /api/v1/auth/login
      http-response-body: '{"status":429,"error":"Too Many Requests","message":"Too many login attempts. Please try again later.","path":"/api/v1/auth/login"}'
      rate-limits:
        - cache-key: getRemoteAddr()
          execute-predicates:
            - "METHOD=POST"
          bandwidths:
            - capacity: 5
              time: 10
              unit: minutes
              refill-speed: interval