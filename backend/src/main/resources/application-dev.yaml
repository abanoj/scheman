## Logging level
logging:
  level:
    com:
      abanoj:
        scheman: DEBUG
## Database Configuration
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
    show-sql: false
  flyway:
    enabled: false
## Exception
server:
  forward-headers-strategy: native
  error:
    include-message: always
## Security
application:
  cors:
    allowed-origins: http://localhost:4200
  security:
    jwt:
      expiration: 900000
      refresh:
        expiration: 604800000
      secret-key: ${JWT_SECRET}
    rate-limit:
      max-attempts: 10
      refill-minutes: 5
  admin:
    email: admin@abanoj.com
    password: ${ADMIN_PASSWORD:admin123}
  demo:
    enabled: true
    reset-cron: "0 0 */6 * * *"
## Swagger
springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
    path: /docs
    doc-expansion: list
## Actuator
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "health, info"
