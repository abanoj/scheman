## Logging level
logging:
  level:
    root: INFO
    org:
      springframework: WARN
      hibernate:
        SQL: off
## Database Configuration
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
## Exception
server:
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never
## Security
application:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    jwt:
      expiration: 900000
      refresh:
        expiration: 604800000
      secret-key: ${JWT_SECRET}
    rate-limit:
      max-attempts: 5
      refill-minutes: 10
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  demo:
    enabled: true
    reset-cron: "0 0 */6 * * *"
## Swagger
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
## Actuator
management:
  endpoint:
    health:
      show-details: never
    shutdown:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health, info, metrics
